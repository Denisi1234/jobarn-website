---
deployment:
  tasks:
    - export DEPLOYPATH=/home/jobarnco/public_html/
    - /bin/cp .htaccess $DEPLOYPATH
    - /bin/cp 404.html about.html cart.html contact.html faq.html google505200829a39cb45.html index.html news-details-software.html news-details.html news.html project-details.html projects.html services-details.html services.html mail.php robots.txt sitemap.xml style.css $DEPLOYPATH
    - /bin/cp -R assets $DEPLOYPATH
    - /bin/cp -R admin $DEPLOYPATH
    - /bin/cp -R api $DEPLOYPATH
    - /bin/cp -R data $DEPLOYPATH
    - /bin/mkdir -p "${DEPLOYPATH}uploads" "${DEPLOYPATH}messages"
    - /bin/cp uploads/.htaccess "${DEPLOYPATH}uploads/"
    - /bin/chmod 777 "${DEPLOYPATH}uploads" "${DEPLOYPATH}data" "${DEPLOYPATH}messages"
    - /bin/chmod 666 "${DEPLOYPATH}data/products.json" "${DEPLOYPATH}data/slides.json" "${DEPLOYPATH}data/settings.json" "${DEPLOYPATH}assets/ecommerce/products.json" "${DEPLOYPATH}assets/ecommerce/slides.json" "${DEPLOYPATH}assets/ecommerce/settings.json"
    - /bin/mkdir -p "${DEPLOYPATH}collections"
    - /bin/cp collections/*.html "${DEPLOYPATH}collections/"
